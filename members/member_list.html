{% extends 'base.html' %}

{% block content %}

<h2>Members</h2>

<a href="{% url 'member_add' %}">+ Add Member</a>

<table border="1">
    <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
    </tr>

    {% for member in members %}
    <tr>
        <td>{{ member.name }}</td>
        <td>{{ member.email }}</td>
        <td>{{ member.phone }}</td>
    </tr>
    {% endfor %}

</table>

{% endblock %}

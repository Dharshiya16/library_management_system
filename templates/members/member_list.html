{% extends 'base.html' %}

{% block content %}

<div class="page-header">

    <div>
        <h1>Members</h1>
        <p>Manage registered library members.</p>
    </div>

    <a class="add-btn" href="{% url 'member_add' %}">
        + Add Member
    </a>

</div>
<form method="get" class="search-form">

    <input
        type="text"
        name="search"
        placeholder="Search members by name..."
        value="{{ search }}"
    >

    <button type="submit">
        Search
    </button>

</form>

<div class="table-card">

    <table>

        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>

            {% for member in members %}

            <tr>
                <td>{{ member.name }}</td>
                <td>{{ member.email }}</td>
                <td>{{ member.phone }}</td>

                <td>

                    <a class="edit-btn"
                       href="{% url 'member_edit' member.id %}">
                        Edit
                    </a>

                    <a class="delete-btn"
                       href="{% url 'member_delete' member.id %}"
                       onclick="return confirm('Are you sure you want to delete this member?');">
                        Delete
                    </a>

                </td>
            </tr>

            {% empty %}

            <tr>
                <td colspan="4" class="empty">
                    No members registered yet.
                </td>
            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}

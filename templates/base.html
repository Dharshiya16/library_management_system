<!DOCTYPE html>
<html>
<head>
    <title>Library Management System</title>


    <style>
        .image-box {
    width: 100%;
    height: 160px;
    overflow: hidden;
    border-radius: 12px;
    margin-bottom: 20px;
}

.image-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #1e293b;
        }

        .navbar {
            background: #1e3a5f;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        .nav-links a:hover {
            color: #93c5fd;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 50px auto;
        }

        .hero {
            text-align: center;
            margin-bottom: 40px;
        }

        .hero h1 {
            font-size: 38px;
            color: #1e3a5f;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 18px;
            color: #64748b;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .card .icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .card h2 {
            color: #1e3a5f;
            margin-bottom: 10px;
        }

        .card p {
            color: #64748b;
            margin-bottom: 20px;
        }

        .card a {
            display: inline-block;
            background: #1e3a5f;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
        }

        .card a:hover {
            background: #2563eb;
        }
        .page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 30px;
    margin-bottom: 30px;
}

.page-header > div {
    flex: 1;
}

.page-header h1 {
    color: #1e3a5f;
    font-size: 32px;
    margin-bottom: 8px;
}

.page-header p {
    color: #64748b;
}

.add-btn {
    background: #1e3a5f;
    color: white;
    padding: 12px 20px;
    border-radius: 8px;
    text-decoration: none;
}

.add-btn:hover {
    background: #2563eb;
}

.table-card {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    overflow-x: auto;
}

.table-card table {
    width: 100%;
    border-collapse: collapse;
}

.table-card th {
    background: #1e3a5f;
    color: white;
    padding: 15px;
    text-align: left;
}

.table-card td {
    padding: 15px;
    border-bottom: 1px solid #e2e8f0;
}

.table-card tr:hover {
    background: #f8fafc;
}

.delete-btn {
    color: #dc2626;
    text-decoration: none;
    font-weight: bold;
}
.edit-btn {
    color: #2563eb;
    text-decoration: none;
    font-weight: bold;
    margin-right: 15px;
}

.edit-btn:hover {
    text-decoration: underline;
}

.delete-btn:hover {
    text-decoration: underline;
}
.empty {
    text-align: center;
    color: #64748b;
}
.form-container {
    max-width: 650px;
    margin: 0 auto;
    background: white;
    padding: 35px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.form-header {
    text-align: center;
    margin-bottom: 30px;
}

.form-header h1 {
    color: #1e3a5f;
    margin-bottom: 8px;
}

.form-header p {
    color: #64748b;
}

.book-form p {
    margin-bottom: 20px;
}

.book-form label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
    color: #334155;
}

.book-form input {
    width: 100%;
    padding: 12px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 15px;
}

.book-form input:focus {
    outline: none;
    border-color: #2563eb;
}

.form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    margin-top: 25px;
}

.cancel-btn,
.save-btn {
    padding: 11px 20px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 15px;
    cursor: pointer;
}

.cancel-btn {
    background: #e2e8f0;
    color: #334155;
}

.save-btn {
    background: #1e3a5f;
    color: white;
    border: none;
}

.save-btn:hover {
    background: #2563eb;
}
.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 25px;
    margin-bottom: 40px;
}

.stat-card {
    background: white;
    padding: 25px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.stat-card h2 {
    color: #1e3a5f;
    font-size: 32px;
    margin-bottom: 8px;
}

.stat-card p {
    color: #64748b;
    font-size: 16px;
}
@media (max-width: 768px) {

    .navbar {
        padding: 18px 20px;
        flex-direction: column;
        gap: 15px;
    }

    .nav-links {
        gap: 15px;
        flex-wrap: wrap;
        justify-content: center;
    }

    .container {
        width: 92%;
        margin: 30px auto;
    }

    .cards,
    .stats {
        grid-template-columns: 1fr;
    }

    .page-header {
        flex-direction: column;
        align-items: flex-start;
    }

}
        .search-form {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
}

.search-form input {
    flex: 1;
    padding: 12px 15px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 15px;
}

.search-form input:focus {
    outline: none;
    border-color: #2563eb;
}

.search-form button {
    background: #1e3a5f;
    color: white;
    border: none;
    padding: 12px 22px;
    border-radius: 8px;
    cursor: pointer;
}

.search-form button:hover {
    background: #2563eb;
}
    </style>
</head>

<body>

<nav class="navbar">

    <div class="logo">
        📚 Library System
    </div>

    <div class="nav-links">
        <a href="/">Home</a>
        <a href="{% url 'book_list' %}">Books</a>
        <a href="{% url 'member_list' %}">Members</a>
        <a href="{% url 'reservation_list' %}">Reservations</a>
    </div>

</nav>

<div class="container">

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
